<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MARS Captionator - WebVTT/SRT Multi‑caption Comparator</title>
  <style>
    :root{
      --bg:#0b0f14; --panel:#121821; --muted:#9fb0c3; --text:#e6edf3; --accent:#4da3ff; --accent-2:#9bdbff; --warning:#f6c549; --active:#2a3b52; --border:#1f2a38;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg)}
    header{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0d141d,#0b0f14)}
    header .title{font-weight:700;letter-spacing:.2px}
    header .controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
    button, .btn, input[type="file"], input[type="text"], input[type="number"]{
      background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:.6rem;padding:.5rem .75rem;cursor:pointer}
    input[type="file"]{cursor:pointer}
    input[type="text"], input[type="number"]{cursor:text}
    button:hover, .btn:hover{border-color:#2b3a4e}
    main{display:grid;grid-template-columns:minmax(380px,1.1fr) 1.5fr;gap:0;height:calc(100% - 58px)}
    @media (max-width: 1100px){main{grid-template-columns:1fr;grid-auto-rows:auto}}

    /* Left: video */
    .left{border-right:1px solid var(--border);padding:1rem;display:flex;flex-direction:column;gap:.75rem;}
    .dropzone{flex:1;display:grid;place-items:center;border:2px dashed var(--border);border-radius:1rem;background:radial-gradient(1200px 400px at 10% 10%, #101826, #0b0f14);min-height:200px}
    .dropzone.drag{border-color:var(--accent)}
    video{max-width:100%;max-height:calc(100vh - 220px);border-radius:1rem;box-shadow:0 10px 30px rgba(0,0,0,.4);background:#000}
    .hint{color:var(--muted);font-size:.9rem}

    /* Right: tracks */
    .right{display:flex;flex-direction:column;min-height:0}
    .right-header{display:flex;gap:.5rem;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--border)}
    #tracks{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}

    .track{background:var(--panel);border:1px solid var(--border);border-radius:1rem;overflow:hidden}
    .track header{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border:none;background:linear-gradient(180deg,#111a26,#0f1620)}
    .track header {position: sticky;  top: 0;  z-index: 2;}
    .track header .meta{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    .pill{font-size:.75rem;color:var(--muted);border:1px dashed var(--border);border-radius:999px;padding:.1rem .5rem}
    .grow{flex:1}
    .small{font-size:.8rem;color:var(--muted)}

    .block{padding:.25rem .75rem .75rem}
    .block details{background:#0f1723;border:1px solid var(--border);border-radius:.6rem;padding:.4rem .6rem}
    .block details summary{cursor:pointer;color:var(--muted)}
    .block pre{white-space:pre-wrap;word-break:break-word;margin:0;color:#c7d6e8}

    .cues{--pad: .5rem; max-height: 320px; overflow:auto;border-top:1px solid var(--border);background:linear-gradient(180deg,#0d141d,#0b1018)}
    .cue{display:grid;grid-template-columns:96px 1fr;gap:.75rem;padding:var(--pad);border-bottom:1px dashed rgba(255,255,255,.05)}
    .cue:last-child{border-bottom:none}
    .cue .timing{font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,monospace;color:var(--muted)}
    .cue .text{white-space:pre-wrap}
    .cue .settings{font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,monospace;font-size:.78rem;color:#b6c3d4;opacity:.9}
    .cue.active{background:linear-gradient(90deg, rgba(77,163,255,.15), transparent 70%); outline:1px solid rgba(77,163,255,.4)}
    .cue.active .timing .warn{color:var(--accent)}
    .cue .id{color:#93b5ff}
    .cue .voice{color:var(--warning);font-weight:600}
    .cue .note{color:#c5b38a}
    .toggle { font-size: 0.9rem; display: flex;      align-items: center;      gap: 0.4rem;      cursor: pointer; }
    .warnings {  margin-top: .2rem; display: flex; flex-wrap: wrap; gap: .25rem; }
    .hidden-warnings .warnings{
      display: none;
    }
    .warn { font-size: .85rem; cursor: help; color: var(--warning); user-select: none; }

    .toolbar{display:flex;gap:.5rem;align-items:center}
    .toolbar label{display:flex;gap:.4rem;align-items:center}
    .toolbar input[type="checkbox"]{transform:translateY(1px)}

    .footer{padding:.5rem 1rem;border-top:1px solid var(--border);color:var(--muted);font-size:.8rem}
  </style>
</head>
<body>
  <header>
    <div class="title">MARS WebVTT/SRT Multi‑Track Comparator</div>
    <div class="controls">
      <label class="btn" for="videoFile">➕ Open Audio/Video (e.g., MP4)</label>
      <input id="videoFile" type="file" accept="video/mp4,video/*,audio/*" hidden>
      <label class="btn" for="vttFiles">➕ Open VTT/SRT (multi)</label>
      <input id="vttFiles" type="file" accept=".vtt,text/vtt,.VTT,.srt,application/x-subrip" multiple hidden>
    </div>
  </header>
  <main>
    <section class="left">
      <div class="dropzone" id="videoDrop">
        <div>
          <div class="hint">Drop an MP4 or audio file here or click “Open Audio/Video”.</div>
        </div>
      </div>
      <video id="player" controls crossorigin="anonymous"></video>
      <div class="hint">Tip: You can drag & drop more VTT &amp; SRT files onto the right column.</div>
    </section>

    <section class="right">
      <div class="right-header toolbar">
        <label class="toggle"> <input type="checkbox" id="toggleWarnings" checked>Show warnings</label>
        <label><input type="checkbox" id="autoScroll" checked> Auto‑scroll to active cue</label>
        <label><input type="checkbox" id="showNotes" checked> Keep NOTE blocks</label>
        <label><input type="checkbox" id="showStyles" checked> Keep STYLE/REGION blocks</label>
        <span class="small">Click a cue to seek to its start.</span>
      </div>
      <div id="tracks" aria-live="polite" aria-relevant="additions"></div>
      <div class="footer" id="footer">Copyright 2025 Lawrence Angrave</div>
    </section>
  </main>

<script>
(function(){
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const player = $('#player');
  const videoFile = $('#videoFile');
  const vttFiles = $('#vttFiles');
  const tracksEl = $('#tracks');
  const autoScrollEl = $('#autoScroll');
  const showNotesEl = $('#showNotes');
  const showStylesEl = $('#showStyles');
  const videoDrop = $('#videoDrop');
  const footer = $('#footer');
  const toggleWarnings = $("#toggleWarnings");
  toggleWarnings.addEventListener("change", e => {
    if (e.target.checked) {
      document.body.classList.remove("hidden-warnings");
    } else {
      document.body.classList.add("hidden-warnings");
    }
  });
  

  let rafToken = null;
  const trackState = new Map(); // id -> state
  let trackSeq = 0;

  // —— File loading helpers ——
  videoFile.addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    loadVideoFile(f);
    e.target.value = '';
  });
  vttFiles.addEventListener('change', e => { handleCaptionFiles(e.target.files); e.target.value=''; });

  // Drag and drop for video (left) and VTTs (right)
  function wireDrop(zone, onFiles){
    ['dragenter','dragover'].forEach(evt=>zone.addEventListener(evt, e=>{ e.preventDefault(); zone.classList.add('drag'); }));
    ['dragleave','drop'].forEach(evt=>zone.addEventListener(evt, e=>{ e.preventDefault(); if(evt==='drop'){ const dt=e.dataTransfer; onFiles(dt.files); } zone.classList.remove('drag'); }));
  }
  wireDrop(videoDrop, files=>{ const f=[...files].find(f=>f.type.startsWith('video/') || f.type.startsWith('audio/') ); if(f) loadVideoFile(f); });
  wireDrop(document.body, files=>{ const list = [...files].filter(f =>  /\.vtt$/i.test(f.name) ||  /\.srt$/i.test(f.name) ||   f.type === 'text/vtt' ||   f.type === 'application/x-subrip'
); if(list.length) handleCaptionFiles(list); });

  function loadVideoFile(file){
    const url = URL.createObjectURL(file);
    player.src = url;
    player.play().catch(()=>{});
  }
  function handleCaptionFiles(fileList){
    [...fileList].forEach(async file=>{
      const text = await file.text();
      const parsed = parseCaption(text);
      const id = `t${++trackSeq}`;
      const state = { id, name:file.name, parsed, pointer:0, activeSet:new Set(), autoscroll:true };
      trackState.set(id, state);
      renderTrack(state);
      scheduleUpdate();
    });
  }

  // —— VTT Parsing (NOT a full spec implementation, but robust and covers NOTE/STYLE/REGION/cue settings) ——
  function parseCaption(source){
    const raw = source.replace(/\r\n?/g,'\n');
    const lines = raw.split('\n');
    if(lines[0] && lines[0].charCodeAt(0) === 0xFEFF) lines[0] = lines[0].slice(1); // strip BOM

    let i = 0;
    let header = '';
    let styles = [];
    let notes = [];
    let regions = [];
    const cues = [];

    // Header: must start with WEBVTT (allowing trailing header text). Skip until blank line
    if(/^WEBVTT(\b|$)/.test(lines[i] || '')){
      header = (lines[i]||'').slice(6).trim();
      i++;
      while(i < lines.length && lines[i].trim() !== ''){ header += (header?'\n':'') + lines[i++]; }
      while(i < lines.length && lines[i].trim() === '') i++;
    }

    while(i < lines.length){
      const line = lines[i];
      if(!line || line.trim() === ''){ i++; continue; }

      if(/^NOTE(\b|$)/.test(line)){
        let noteHeader = line.slice(4).trim(); i++;
        const buf=[]; while(i<lines.length && lines[i].trim() !== '') buf.push(lines[i++]);
        notes.push({ header: noteHeader, text: buf.join('\n') });
        continue;
      }
      if(/^STYLE(\b|$)/.test(line)){
        i++; const buf=[]; while(i<lines.length && lines[i].trim() !== '') buf.push(lines[i++]);
        styles.push(buf.join('\n'));
        continue;
      }
      if(/^REGION(\b|$)/.test(line)){
        // REGION may have settings on same line or subsequent lines until blank
        let tokens = line.replace(/^REGION\s*/, '').trim(); i++;
        const buf=[]; while(i<lines.length && lines[i].trim() !== '') buf.push(lines[i++]);
        const all = (tokens? [tokens] : []).concat(buf);
        const obj={}; all.join(' ').split(/\s+/).forEach(tok=>{ const m=tok.split(':'); if(m.length>=2){ obj[m[0]] = m.slice(1).join(':'); }});
        regions.push(obj);
        continue;
      }

      // Cue block  match timestamps 00:01:23,456 (SRT) or  00:01:23.456 (VTT)
      let id=null; let timeLine=line;
      if(line.indexOf('-->') === -1){ id = line.trim(); i++; timeLine = lines[i] || ''; }
      const m = /^(\d{1,2}:)?\d{2}:\d{2}[.,]\d{3}\s+-->\s+(\d{1,2}:)?\d{2}:\d{2}[.,]\d{3}(?:\s+(.+))?$/.exec(timeLine.trim());
      if(!m){ // not a cue, skip until blank
        while(i<lines.length && lines[i].trim() !== '') i++;
        continue;
      }
      const [_, sH, eH, settingsStrRaw] = [m[0], m[1], m[2], m[3]];
      const [startStr, endStr] = timeLine.split('-->').map(s=>s.trim()).slice(0,2);
      const settingsStr = (timeLine.split('-->')[1]||'').replace(endStr,'').trim();
      const start = parseTimestamp(startStr);
      const end = parseTimestamp(endStr);
      const settings = parseSettings(settingsStr);
      i++;
      const textLines=[]; while(i<lines.length && lines[i].trim() !== '') textLines.push(lines[i++]);
      cues.push({ id, start, end, settings, rawText: textLines.join('\n') });
    }
    checkCaptions(cues);
    return { header, styles, notes, regions, cues };
  }

  function checkCaptions(cueList) {
    const MIN_DURATION = 2.0;   // seconds
    const MAX_DURATION = 6.0;
    const MAX_LINES = 2;
    const MAX_CHARS_PER_LINE = 32;
    const MAX_SILENCE = 3.0;    // seconds
    const MAX_READING_SPEED = 20; // chars per second

    // Minimal HTML entity decoder
    const entities = {
      amp: "&", lt: "<", gt: ">", quot: '"', apos: "'",
      nbsp: " ", ndash: "–", mdash: "—", hellip: "…"
    };
    function decodeEntities(str) {
      return str.replace(/&(#x?[0-9a-f]+|\w+);/gi, (m, code) => {
        if (code[0] === '#') {
          // numeric entity
          let n;
          if (code[1] === 'x' || code[1] === 'X') {
            n = parseInt(code.slice(2), 16);
          } else {
            n = parseInt(code.slice(1), 10);
          }
          if (!isNaN(n)) return String.fromCodePoint(n);
        } else if (entities.hasOwnProperty(code)) {
          return entities[code];
        }
        // unknown entity -> treat as one char
        return "�";
      });
    }

    // Sort cues by start time
    cueList.sort((a, b) => a.start - b.start);

    for (let i = 0; i < cueList.length; i++) {
      const cue = cueList[i];
      cue.warnings = [];

      const dur = cue.end - cue.start;
      const lines = cue.rawText.split(/\r?\n/);

      // --- Duration Checks ---
      if (dur < 0) {
        cue.warnings.push({'err':'mindur', 'explain':`Duration is negative (end time is before start time).`});
      } else 
      if (cue.start === cue.end) {
        cue.warnings.push({'err':'mindur', 'explain':`Start time is the same as the end time.`});
      } else 
      if (dur < MIN_DURATION) {
        cue.warnings.push({'err':'mindur', 'explain':`Duration too short (${dur.toFixed(2)}s, min ${MIN_DURATION}s).`});
      }
      
      if (dur > MAX_DURATION) {
        cue.warnings.push({'err':'maxdur', 'explain':`Duration too long (${dur.toFixed(2)}s, max ${MAX_DURATION}s).`});
      }

      // --- Line count ---
      if (lines.length > MAX_LINES) {
        cue.warnings.push({'err':'linecount', 'explain':`Too many lines (${lines.length}, max ${MAX_LINES}).`});
      }

      // --- Line length + trailing spaces ---
      lines.forEach((line, idx) => {
        const decoded = decodeEntities(line);
        if (decoded.length > MAX_CHARS_PER_LINE) {
          cue.warnings.push({'err':'maxlinelen', 'explain': `Line ${idx+1} too long (${decoded.length} chars, max ${MAX_CHARS_PER_LINE}).`});
        }
        if (/\s$/.test(line)) {
          cue.warnings.push({'err':'trailspace','explain':`Line ${idx+1} has trailing spaces.`});
        }
      });

      // --- Reading speed ---
      const decodedText = decodeEntities(lines.join(" "));
      const cps = decodedText.length / dur;
      if (cps > MAX_READING_SPEED) {
        cue.warnings.push({'err':'readfast','explain':`Reading speed too high (${cps.toFixed(1)} cps, max ${MAX_READING_SPEED}).`});
      }

      // --- Overlaps ---
      if (i > 0 && cue.start < cueList[i-1].end) {
        cue.warnings.push({'err':'overlap','explain':`Overlaps with previous cue (starts at ${cue.start.toFixed(2)}s, previous ends at ${cueList[i-1].end.toFixed(2)}s).`});
      }

      // --- Silence gap ---
      if (i > 0) {
        const gap = cue.start - cueList[i-1].end;
        if (gap > MAX_SILENCE) {
          cue.warnings.push({'err':'gap','explain':`Long silence gap before cue (${gap.toFixed(2)}s, max ${MAX_SILENCE}s).`});
        }
      }

      // --- Empty text ---
      if (!cue.rawText.trim()) {
        cue.warnings.push({'err':'empty','explain':"Empty cue text."});
      }

      // --- Punctuation check ---
      const trimmed = decodedText.trim();
      if (trimmed.length > 0 && /^[A-Za-z0-9]/.test(trimmed)) {
        if (!/[.?!…]$/.test(trimmed)) {
          cue.warnings.push({'err':'endpunct','explain':"Cue does not end with proper punctuation."});
        }
      }
    }

    return cueList;
  }
  

  function parseTimestamp(ts){
    ts = ts.trim().replace(',', '.'); // normalize SRT commas to dot
    const parts = ts.split(':');
    let h=0, m=0, s=0;
    // Accept MM:SS.mmm or HH:MM:SS.mmm
    if(parts.length === 3){
      h = parseInt(parts[0],10); 
      m = parseInt(parts[1],10); 
      s = parseFloat(parts[2]);
    }
    else if(parts.length === 2){
      m = parseInt(parts[0],10); 
      s = parseFloat(parts[1]);
    }
    else { return 0; }
    return h*3600 + m*60 + s;
  }  
  
  function parseSettings(str){
    const obj={};
    if(!str) return obj;
    str.trim().split(/\s+/).forEach(tok=>{
      const [k,v] = tok.split(':'); if(k && v !== undefined) obj[k]=v;
    });
    return obj;
  }

  // —— Rendering ——
  const warningIcons = {
    mindur: "⏱️",    // duration too short (or start=end or end before start)
    maxdur: "🕰️",    // too long
    linecount: "📏",  // too many lines
    maxlinelen: "➡️", // line too long
    trailspace: "␣",  // trailing space
    readfast: "⚡",   // fast reading speed
    overlap: "🔗",    // overlap
    gap: "…",        // long gap between captions
    empty: "∅",      // empty
    endpunct: "❗"    // missing punctuation
  };
  
  function updateFooter(cue) {
      let footer_text = "No warnings"
      if (cue.warnings.length) {
        footer_text = ""
        cue.warnings.forEach(w => {
          footer_text += (footer_text.length ? ' ' : '') + (warningIcons[w.err] || "⚠️") + '&nbsp';
          footer_text += w.explain;    
        });
        
      }
      footer.innerHTML=footer_text;
  }
  function renderTrack(state){
    const { id, name, parsed } = state;
    const el = document.createElement('section');
    el.className = 'track'; el.id = id;

    // header
    const h = document.createElement('header');
    const title = document.createElement('div');
    title.className='meta';
    title.innerHTML = `<strong>${escapeHtml(name)}</strong> <span class="small">${parsed.cues.length} cues</span>`;

    const grow = document.createElement('div'); grow.className='grow';
    const tools = document.createElement('div'); tools.className='toolbar';
    tools.innerHTML = `
      <label><input type="checkbox" class="autoscroll" checked> Auto‑scroll</label>
      <button class="btn scrollTop" title="Scroll to top">⤒</button>
    `;

    h.append(title,grow,tools);
    el.appendChild(h);

    // Meta blocks
    const metaBlock = document.createElement('div'); metaBlock.className='block';
    if(showNotesEl.checked && parsed.notes.length){
      const d = document.createElement('details'); d.open=false;
      const s = document.createElement('summary'); s.textContent = `NOTE blocks (${parsed.notes.length})`;
      const pre = document.createElement('pre'); pre.textContent = parsed.notes.map(n => (n.header?`[${n.header}]\n`:'') + n.text).join('\n\n---\n\n');
      d.append(s, pre); metaBlock.appendChild(d);
    }
    if(showStylesEl.checked && (parsed.styles.length || parsed.regions.length)){
      const d = document.createElement('details'); d.open=false;
      const s = document.createElement('summary'); s.textContent = `STYLE/REGION info`;
      const pre = document.createElement('pre');
      const regionText = parsed.regions.length ? ('Regions:\n' + JSON.stringify(parsed.regions, null, 2) + '\n\n') : '';
      pre.textContent = regionText + (parsed.styles.length ? ('Styles:\n' + parsed.styles.join('\n\n')) : '(none)');
      d.append(s, pre); metaBlock.appendChild(d);
    }
    el.appendChild(metaBlock);

    const cuesEl = document.createElement('div'); cuesEl.className='cues';

    parsed.cues.forEach((cue, idx)=>{
      const cueEl = document.createElement('div'); cueEl.className='cue'; cueEl.tabIndex=0;
      cueEl.dataset.start = cue.start; cueEl.dataset.end = cue.end; cueEl.dataset.index = idx;
      cueEl.addEventListener('click', ()=>{ updateFooter(cue); player.currentTime = cue.start; player.pause(); scheduleUpdate(true); });

      const timing = document.createElement('div'); timing.className='timing';
      const idEl = document.createElement('div'); idEl.className='id small';
      if(cue.id) idEl.textContent = cue.id;
      timing.innerHTML = `${fmt(cue.start)} → ${fmt(cue.end)}${cue.id?`<div class="id">${escapeHtml(cue.id)}</div>`:''}`;

      const text = document.createElement('div'); text.className='text';
      text.append(renderCueText(cue.rawText));

      const wrap = document.createElement('div');
      const settings = document.createElement('div'); settings.className='settings';
      const s = cue.settings; const keys = Object.keys(s);
      settings.textContent = keys.length ? keys.map(k=>`${k}:${s[k]}`).join(' ') : '';
      wrap.append(text, settings);
      if (cue.warnings.length) {
        const warnBox = document.createElement("div");
        warnBox.className = "warnings";
        cue.warnings.forEach(w => {
          const icon = document.createElement("span");
          icon.className = "warn";
          icon.textContent = warningIcons[w.err] || "⚠️";
          icon.title = w.explain; // hover shows full explanation
          warnBox.appendChild(icon);
        });
        wrap.appendChild(warnBox);
      }
      cueEl.append(timing, wrap);
      cuesEl.appendChild(cueEl);
    });

    el.appendChild(cuesEl);
    tracksEl.prepend(el);

    // wire toolbar
    $('.autoscroll', el).addEventListener('change', (e)=>{ state.autoscroll = e.target.checked; });
    $('.scrollTop', el).addEventListener('click', ()=>{ cuesEl.scrollTo({top:0, behavior:'smooth'}); });

    state.container = el; state.cuesEl = cuesEl; state.cueEls = $$('.cue', cuesEl);
  }

  function renderCueText(raw){
    // Minimal, safe rendering: escape HTML, then try to extract <v Speaker>…</v> tags into a prefix label.
    // Does not execute STYLE blocks from file. Keeps everything inert.
    const frag = document.createDocumentFragment();
    // Collect voice tags globally
    const voiceRe = /<v(?:\s+([^>]*))?>([\s\S]*?)<\/v>/gi;
    let lastIndex = 0; let m;
    const container = document.createElement('span');
    while((m = voiceRe.exec(raw))){
      const before = raw.slice(lastIndex, m.index);
      if(before) container.appendChild(textNode(before));
      const who = (m[1]||'').trim();
      const spoken = m[2]||'';
      if(who){ const label = document.createElement('span'); label.className='voice'; label.textContent = who + ': '; container.appendChild(label); }
      container.appendChild(textNode(spoken));
      lastIndex = voiceRe.lastIndex;
    }
    const tail = raw.slice(lastIndex);
    if(tail) container.appendChild(textNode(tail));

    frag.appendChild(container);
    return frag;
  }
  function textNode(s){ return document.createTextNode(s.replace(/\r\n?/g,'\n')); }

  // —— Sync & highlight ——
  function scheduleUpdate(force){
    if(force){ if(rafToken) cancelAnimationFrame(rafToken); rafToken=null; doUpdate(); return; }
    if(rafToken) return; rafToken = requestAnimationFrame(()=>{ rafToken=null; doUpdate(); });
  }
  function doUpdate(){
    const tVideo = player.currentTime || 0;
    trackState.forEach(state => {
      const t = tVideo;
      const active = indicesAtTime(state, t);
      const activeSet = new Set(active);
      // Update DOM classes
      state.cueEls.forEach((el, idx)=>{
        const on = activeSet.has(idx);
        el.classList.toggle('active', on);
      });
      // Auto-scroll to first active
      if((autoScrollEl.checked && state.autoscroll) && active.length){
        const first = state.cueEls[active[0]];
        first?.scrollIntoView({block:'nearest', inline:'nearest'});
      }
      state.activeSet = activeSet;
    });
  }

  function indicesAtTime(state, t){
    const cues = state.container ? state.parsed.cues : [];
    if(!cues.length) return [];
    // Keep a pointer and expand around it; fall back to binary search on seek
    if(state.pointer == null || t < cues[state.pointer].start || t >= cues[state.pointer].end){
      state.pointer = bsearchCue(cues, t);
    }
    const res=[];
    // Collect overlapping cues around pointer
    for(let i = state.pointer; i >= 0 && cues[i].end > t - 0.0005; i--){ if(cues[i].start <= t && t < cues[i].end) res.push(i); else if(cues[i].end <= t) break; }
    for(let i = state.pointer+1; i < cues.length && cues[i].start < t + 0.0005; i++){ if(cues[i].start <= t && t < cues[i].end) res.push(i); else if(cues[i].start > t) break; }
    res.sort((a,b)=>a-b);
    return res;
  }
  function bsearchCue(cues, t){
    let lo=0, hi=cues.length-1, ans=0;
    while(lo<=hi){
      const mid=(lo+hi>>1); const c=cues[mid];
      if(t < c.start) hi = mid-1;
      else if(t >= c.end) lo = mid+1;
      else { return mid; }
      ans = lo;
    }
    return Math.max(0, Math.min(ans, cues.length-1));
  }

  function fmt(sec){
    const s = Math.max(0, sec);
    const h = Math.floor(s/3600);
    const m = Math.floor((s%3600)/60);
    const r = (s%60);
    const mm = (h? String(m).padStart(2,'0') : String(m));
    const hh = h? h+':':'';
    return hh + mm + ':' + r.toFixed(3).padStart(6,'0');
  }
  function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' }[c])); }

  // —— Wire video events ——
  ['timeupdate','seeking','seeked','ratechange','loadedmetadata','play','pause'].forEach(evt=>{
    player.addEventListener(evt, ()=> scheduleUpdate());
  });

  // Start paused with a black video element. Users load files.
})();
</script>
